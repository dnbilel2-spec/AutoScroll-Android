
name: Build Auto Scroll APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir -p extracted
          unzip -o "$(find . -maxdepth 1 -name '*.zip' | head -n 1)" -d extracted
          cp -R extracted/. .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoScroll-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
